# LOCAL CANDIDATE: one Next service, no authentication sidecar. Not yet deployed.
# Loaded in the shared proxy http context; the app stays on the private preview network.
limit_req_zone $binary_remote_addr zone=sophomores_preview_auth:10m rate=5r/s;
map "$request_method:$uri" $sophomores_preview_login_key {
    default "";
    "POST:/api/session" $binary_remote_addr;
    "POST:/api/session/logout" $binary_remote_addr;
}
limit_req_zone $sophomores_preview_login_key zone=sophomores_preview_login:1m rate=5r/m;

server {
    listen 80;
    server_name preview.sophomores.co;
    include /etc/nginx/headers.conf;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET { deny all; }
    }

    location / {
        return 301 https://preview.sophomores.co$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name preview.sophomores.co;
    ssl_certificate /etc/letsencrypt/live/preview.sophomores.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.sophomores.co/privkey.pem;
    # ssl.conf already includes headers.conf and the shared server-level resolver.
    include /etc/nginx/ssl.conf;

    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
    # Native auth forms are bounded to 4 KiB; no uploads are enabled in the teaser.
    client_max_body_size 4k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;
    limit_req zone=sophomores_preview_auth burst=100 nodelay;
    limit_req zone=sophomores_preview_login burst=10 nodelay;
    limit_req_status 429;

    set $sophomores_preview_upstream sophomores-preview-app:3000;

    # Next protects its own paths/assets. The auxiliary AR service uses this
    # internal-only verifier against the same session implementation in Next.
    location = /api/session/verify {
        internal;
        auth_request off;
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;
        proxy_pass http://$sophomores_preview_upstream/api/session/verify;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Host preview.sophomores.co;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_cache off;
    }

    # BEGIN isolated AR trial
    location ~ ^/ar(?:/|$) {
        auth_request /api/session/verify;
        error_page 401 =303 https://preview.sophomores.co/login;
        set $sophomores_ar_upstream sophomores-preview-ar:8080;
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;
        proxy_pass http://$sophomores_ar_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host preview.sophomores.co;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header X-Robots-Tag;
    }
    # END isolated AR trial

    location / {
        # Local add_header directives replace shared server-header inheritance.
        # Preserve Next's route-specific CSP instead of appending the shared CSP.
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Permissions-Policy "magnetometer=(), microphone=(), payment=(), usb=()" always;

        # Override the shared public resolver only for this Docker upstream.
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;
        proxy_pass http://$sophomores_preview_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host preview.sophomores.co;
        proxy_set_header X-Forwarded-Host preview.sophomores.co;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        # Do not let caller-supplied framework control headers bypass the gate.
        proxy_set_header X-Middleware-Subrequest "";
        proxy_set_header X-Middleware-Rewrite "";
        proxy_set_header X-Middleware-Override-Headers "";
        proxy_set_header X-Middleware-Redirect "";
        proxy_set_header X-Middleware-Set-Cookie "";
        proxy_set_header X-Middleware-Skip "";
        proxy_set_header X-Middleware-Next "";
        proxy_set_header X-Now-Route-Matches "";
        proxy_set_header X-Matched-Path "";
        proxy_set_header X-Nextjs-Rewritten-Path "";
        proxy_set_header X-Nextjs-Rewritten-Query "";
        # RSC/Next-Router-* request headers remain intact for authenticated navigation.
        proxy_intercept_errors off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Surrogate-Control;
        proxy_hide_header CDN-Cache-Control;
        proxy_hide_header Vercel-CDN-Cache-Control;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Powered-By;
    }
}
